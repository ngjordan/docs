name: iOS

# Builds, signs and uploads an iOS app to TestFlight.
#
# Signing material comes from repository secrets, all set through the App Store
# Connect API (packaging/asc_create_cert.py, packaging/asc_setup.py):
#
#   ASC_API_KEY                          the AuthKey_*.p8
#   ASC_ISSUER_ID                        the Issuer ID
#   ASC_KEY_ID                           the Key ID
#   APPLE_DISTRIBUTION_CERTIFICATE       base64 of the distribution .p12
#   APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD  that .p12's password
#   APPLE_MOBILEROVISION_PROFILE         hex of the .mobileprovision
#   APPLE_TEAM_ID                        the team id
#
# Requires a macOS runner: xcodebuild, the iOS SDK and the signing tools only
# exist there.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: ph.iridium.docs
  TEAM_ID: 5JY6QC2345
  SCHEME_NAME: IridiumDocs
  # The profile's NAME (not its bundle id): Xcode matches
  # PROVISIONING_PROFILE_SPECIFIER against the name.
  PROFILE_NAME: Iridium Docs App Store
  # The workspace root: an Xcode project sits in apps/ios/.
  PROJECT_DIR: apps/ios

jobs:
  build:
    name: Build and upload to TestFlight
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          xcodebuild -version

      - name: Import the distribution certificate
        env:
          # Secrets go through the environment, never into a run: line, where
          # an expression would be interpolated into the shell command.
          DIST_CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dist.p12"
          printf '%s' "$DIST_CERT_B64" | base64 --decode > "$CERT"
          # Prove the secret survived the trip: the decoded file must be a valid
          # PKCS#12 and must open with the password we were given. Without these
          # checks a bad decode or a mangled password surfaces only as the
          # opaque "MAC verification failed" from security import.
          echo "cert bytes: $(wc -c < "$CERT")"
          echo "cert sha256: $(shasum -a 256 "$CERT" | cut -d' ' -f1)"
          echo "password length: ${#DIST_CERT_PASSWORD}"
          echo "password repr: $(printf '%s' "$DIST_CERT_PASSWORD" | od -c | head -2)"
          if ! openssl pkcs12 -in "$CERT" -passin "pass:$DIST_CERT_PASSWORD" -nokeys -passout pass: \
               >/dev/null 2>&1; then
            echo "::error::the certificate and password do not match as delivered"
            exit 1
          fi
          echo "certificate opens with the password"
          # A throwaway keychain: the password is random and the keychain dies
          # with the job.
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$RUNNER_TEMP" "$KC"
          # `-t cert` matters: without it security tries to import the private
          # key too and the import fails with "MAC verification failed" even
          # when the password is right.
          security import "$CERT" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$KC"
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$RUNNER_TEMP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          echo "MACOS_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"

      - name: Install the provisioning profile
        env:
          PROFILE_HEX: ${{ secrets.APPLE_MOBILEROVISION_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # The profile is stored hex-encoded so it survives the secrets API.
          echo "$PROFILE_HEX" | xxd -r -p \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/$BUNDLE_ID.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/$BUNDLE_ID.mobileprovision" \
            > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist

      - name: Build the archive
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild archive \
            -scheme "$SCHEME_NAME" \
            -project IridiumDocs.xcodeproj \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | tee "$RUNNER_TEMP/xcodebuild.log"
          # xcpretty swallows the useful part of xcodebuild's output; grep the
          # raw log so a failure names its real cause.
          if [[ ! -d "$RUNNER_TEMP/App.xcarchive" ]]; then
            echo "::error::archive failed"
            grep -iE "error:|❌" "$RUNNER_TEMP/xcodebuild.log" | head -30 || true
            exit 1
          fi
          ls -la "$RUNNER_TEMP/App.xcarchive"

      - name: Export the ipa
        run: |
          set -euo pipefail
          # The YAML block scalar indents this block, so the heredoc body is
          # indented too - which would become part of the plist. Strip the
          # leading whitespace, then check it parses before using it.
          # An XML plist: the JSON form is not a plist plistlib can read, and
          # the YAML block scalar indents this block, so the heredoc body is
          # indented too - which would become part of the file. Strip it.
          cat > "$RUNNER_TEMP/ExportOptions.plist.in" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>PLACEHOLDER_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>PLACEHOLDER_BUNDLE</key>
              <string>PLACEHOLDER_PROFILE</string>
            </dict>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST
          sed -e "s/PLACEHOLDER_TEAM/$TEAM_ID/" \
              -e "s/PLACEHOLDER_BUNDLE/$BUNDLE_ID/" \
              -e "s/PLACEHOLDER_PROFILE/$PROFILE_NAME/" \
              "$RUNNER_TEMP/ExportOptions.plist.in" \
              | sed -e 's/^[[:space:]]*//' > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main'
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          pip3 install --quiet aliyun-asc-api 2>/dev/null || true
          # The Transporter CLI ships with Xcode; it is the supported upload path.
          xcrun altool --upload-app --file "$RUNNER_TEMP/ipa"/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" --type ios

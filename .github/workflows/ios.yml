name: iOS

# Builds, signs and uploads an iOS app to TestFlight.
#
# Signing material comes from repository secrets, all set through the App Store
# Connect API (packaging/asc_create_cert.py, packaging/asc_setup.py):
#
#   ASC_API_KEY                          the AuthKey_*.p8
#   ASC_ISSUER_ID                        the Issuer ID
#   ASC_KEY_ID                           the Key ID
#   APPLE_DISTRIBUTION_CERTIFICATE       base64 of the distribution .p12
#   APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD  that .p12's password
#   APPLE_MOBILEROVISION_PROFILE         hex of the .mobileprovision
#   APPLE_TEAM_ID                        the team id
#
# Requires a macOS runner: xcodebuild, the iOS SDK and the signing tools only
# exist there.

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: ph.iridium.docs
  TEAM_ID: 5JY6QC2345
  SCHEME_NAME: IridiumDocs
  # The profile's NAME (not its bundle id): Xcode matches
  # PROVISIONING_PROFILE_SPECIFIER against the name.
  PROFILE_NAME: Iridium Docs App Store
  # The workspace root: an Xcode project sits in apps/ios/.
  PROJECT_DIR: apps/ios

jobs:
  build:
    name: Build and upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Apple requires uploads to be built with Xcode 26+ / the iOS 26 SDK
          # (since 2026-04-28). The macos-15 arm64 image ships 26.3.
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          xcodebuild -showsdks | grep -i "ios" || true

      - name: Import the distribution certificate
        env:
          # Secrets go through the environment, never into a run: line, where
          # an expression would be interpolated into the shell command.
          DIST_CERT_B64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE }}
          DIST_CERT_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          CERT="$RUNNER_TEMP/dist.p12"
          printf '%s' "$DIST_CERT_B64" | base64 --decode > "$CERT"
          # Prove the secret survived the trip: the decoded file must be a valid
          # PKCS#12 and must open with the password we were given. Without these
          # checks a bad decode or a mangled password surfaces only as the
          # opaque "MAC verification failed" from security import.
          echo "cert bytes: $(wc -c < "$CERT")"
          # Quote the cut output: shellcheck SC2046.
          CERT_SHA=$(shasum -a 256 "$CERT" | cut -d' ' -f1)
          echo "cert sha256: $CERT_SHA"
          echo "password length: ${#DIST_CERT_PASSWORD}"
          echo "password repr: $(printf '%s' "$DIST_CERT_PASSWORD" | od -c | head -2)"
          if ! openssl pkcs12 -in "$CERT" -passin "pass:$DIST_CERT_PASSWORD" -nokeys -passout pass: \
               >/dev/null 2>&1; then
            echo "::error::the certificate and password do not match as delivered"
            exit 1
          fi
          echo "certificate opens with the password"
          # A throwaway keychain: the password is random and the keychain dies
          # with the job.
          KC="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$RUNNER_TEMP" "$KC"
          # No -t cert: it restricts the import to certificates and drops the
          # private key, and codesign needs the key to sign. The earlier
          # "MAC verification failed" was the algorithm mismatch, not this flag:
          # the .p12 must use 3DES and a SHA-1 MAC (Apple's Security framework
          # rejects PBES2/AES and an HMAC-SHA256 MAC), which is how it is
          # exported.
          security import "$CERT" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12 -k "$KC"
          rm -f "$CERT"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$RUNNER_TEMP" "$KC" >/dev/null
          # Add our keychain to the user's search list, keeping the ones that
          # are already there. macOS ships bash 3.2, so no mapfile/readarray:
          # build the argument list with a plain loop instead.
          KEYCHAIN_ARGS=()
          while IFS= read -r KC_PATH; do
            KC_PATH=${KC_PATH#\"}       # strip the leading quote
            KC_PATH=${KC_PATH%\"}       # and the trailing one
            [ -n "$KC_PATH" ] && KEYCHAIN_ARGS+=("$KC_PATH")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "$KC" "${KEYCHAIN_ARGS[@]}"
          echo "MACOS_KEYCHAIN=$KC" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KC"

      - name: Install the provisioning profile
        env:
          PROFILE_HEX: ${{ secrets.APPLE_MOBILEROVISION_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          # The profile is stored hex-encoded so it survives the secrets API.
          echo "$PROFILE_HEX" | xxd -r -p \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/$BUNDLE_ID.mobileprovision"
          security cms -D -i "$HOME/Library/MobileDevice/Provisioning Profiles/$BUNDLE_ID.mobileprovision" \
            > /tmp/profile.plist
          /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist

      - name: Build the archive
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          xcodebuild archive \
            -scheme "$SCHEME_NAME" \
            -project IridiumDocs.xcodeproj \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            | tee "$RUNNER_TEMP/xcodebuild.log"
          # xcpretty swallows the useful part of xcodebuild's output; grep the
          # raw log so a failure names its real cause.
          if [[ ! -d "$RUNNER_TEMP/App.xcarchive" ]]; then
            echo "::error::archive failed"
            grep -iE "error:|❌" "$RUNNER_TEMP/xcodebuild.log" | head -30 || true
            exit 1
          fi
          ls -la "$RUNNER_TEMP/App.xcarchive"

      - name: Export the ipa
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          # The YAML block scalar indents this block, so the heredoc body is
          # indented too - which would become part of the plist. Strip the
          # leading whitespace, then check it parses before using it.
          # An XML plist: the JSON form is not a plist plistlib can read, and
          # the YAML block scalar indents this block, so the heredoc body is
          # indented too - which would become part of the file. Strip it.
          cat > "$RUNNER_TEMP/ExportOptions.plist.in" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>PLACEHOLDER_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>PLACEHOLDER_BUNDLE</key>
              <string>PLACEHOLDER_PROFILE</string>
            </dict>
            <key>destination</key>
            <string>upload</string>
          </dict>
          </plist>
          PLIST
          sed -e "s/PLACEHOLDER_TEAM/$TEAM_ID/" \
              -e "s/PLACEHOLDER_BUNDLE/$BUNDLE_ID/" \
              -e "s/PLACEHOLDER_PROFILE/$PROFILE_NAME/" \
              "$RUNNER_TEMP/ExportOptions.plist.in" \
              | sed -e 's/^[[:space:]]*//' > "$RUNNER_TEMP/ExportOptions.plist"
          plutil -lint "$RUNNER_TEMP/ExportOptions.plist"
          # destination=upload makes xcodebuild want an Apple ID in Xcode's
          # Accounts ("App Store Connect access for <team> is required"), which
          # an API key cannot provide. Export the ipa locally instead and let
          # altool do the upload - altool takes the API key.
          sed -e 's|<string>upload</string>|<string>export</string>|' \
            "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/ExportOptions-export.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to TestFlight
        if: github.ref == 'refs/heads/main'
        env:
          ASC_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          # altool reads the key from ~/.appstoreconnect/private_keys (or
          # ./private_keys); --apiKey names the key id, --apiIssuer the issuer.
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          # The build number (CFBundleVersion). It has to be higher than the
          # last uploaded one, and the project generator computes it; read it
          # back so the TestFlight step targets this build and not another.
          BUILD_VERSION=$(grep -oE 'CURRENT_PROJECT_VERSION = [0-9]+' \
            apps/ios/IridiumDocs.xcodeproj/project.pbxproj | head -1 | grep -oE '[0-9]+')
          echo "build version: $BUILD_VERSION"
          # Apple reports a missing App Store Connect app record as
          # "No suitable application records were found", which reads like a
          # signing problem. Turn it into an actionable message.
          set +e
          xcrun altool --upload-app --file "$RUNNER_TEMP/ipa"/*.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER" --type ios 2>&1 | tee "$RUNNER_TEMP/altool.log"
          UPLOAD_RC=${PIPESTATUS[0]}
          set -e
          # altool has been observed to exit 0 even when it prints
          # "Failed to upload package", so trust the log as well as the code.
          if grep -q "Failed to upload package" "$RUNNER_TEMP/altool.log"; then
            UPLOAD_RC=1
          fi
          if [[ "$UPLOAD_RC" != 0 ]]; then
            # Surface altool's own error lines; the step's log is the only
            # place they appear and they say exactly what Apple rejected.
            grep -E "ERROR:|iris-code" "$RUNNER_TEMP/altool.log" | head -10 || true
          fi
          if [[ "$UPLOAD_RC" == 0 ]]; then
            # The upload alone does not make the build testable. Apple needs
            # export compliance declared and the build attached to an
            # external beta group (the default "Team" group is internal and
            # refuses manually uploaded builds).
            # The runner's python is externally managed, so a plain pip
            # install fails and leaves a *different* jwt package behind
            # (one without .encode). Use a venv.
            python3 -m venv "$RUNNER_TEMP/asc-venv"
            "$RUNNER_TEMP/asc-venv/bin/pip" install --quiet --disable-pip-version-check jwt
            export APPLE_KEY_DIR="$RUNNER_TEMP/apple-key"
            mkdir -p "$APPLE_KEY_DIR"
            printf '%s' "$ASC_KEY" > "$APPLE_KEY_DIR/AuthKey_$ASC_KEY_ID.p8"
            printf '%s' "$ASC_ISSUER" > "$APPLE_KEY_DIR/issuer_id"
            printf '%s' "$ASC_KEY_ID" > "$APPLE_KEY_DIR/key_id"
            chmod 600 "$APPLE_KEY_DIR"/*
            # Apple processes an upload asynchronously, so the build may not be
            # assignable yet. Retry, and fail the job if it never becomes
            # assignable - a silent success here would leave an untestable
            # build in App Store Connect.
            TF_OK=0
            for _try in 1 2 3 4 5 6 7 8; do
              if "$RUNNER_TEMP/asc-venv/bin/python" packaging/testflight.py --version "$BUILD_VERSION"; then
                TF_OK=1
                break
              fi
              echo "::warning::the build is still processing; retrying in 60s"
              sleep 60
            done
            if [[ "$TF_OK" != 1 ]]; then
              echo "::error::the build uploaded but was never made testable (export"
              echo "::error::compliance or the beta group assignment failed)."
              exit 1
            fi
          fi
          if [[ "$UPLOAD_RC" != 0 ]] && grep -q "No suitable application records" "$RUNNER_TEMP/altool.log"; then
            echo "::error::no App Store Connect app record exists for bundle id $BUNDLE_ID."
            echo "::error::Apple does not allow creating app records through the API - it is a one-time"
            echo "::error::step in the web UI: https://appstoreconnect.apple.com/apps"
            echo "::error::  + -> New App -> Name 'Iridium Docs' -> Platform iOS"
            echo "::error::  -> Bundle ID '$BUNDLE_ID' (the existing one) -> SKU IRIDIUM-DOCS-IOS"
            exit 1
          fi
          exit "$UPLOAD_RC"

name: macOS

# Builds, signs and notarizes the macOS artifacts (Iridium Docs.app DMG + the
# headless CLI) on a macOS runner, and publishes them as a GitHub release
# asset.
#
# Required repository secrets (all optional - without them the build falls back
# to ad-hoc signing and is not notarized):
#
#   APPLE_CERTIFICATE           base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD  that .p12's password
#   KEYCHAIN_PASSWORD           password for the temporary signing keychain
#   APPLE_ID                    Apple account email for notarization
#   APPLE_PASSWORD              app-specific password for that account
#   APPLE_TEAM_ID               10-character Apple team id
#
# How to produce APPLE_CERTIFICATE:
#   base64 -i "Developer ID Application: <Name> (<TEAM>).p12" -o cert.b64
#   # then paste cert.b64's contents into the secret
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run (empty = Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, sign and notarize
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Rust toolchain: the workspace needs 1.95 or newer.
      RUST_VERSION: "1.99.1"
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # The packaging scripts read the version from Cargo.toml; an override lets a
      # manual run ship a different version. `inputs.version` is user-supplied, so
      # it is only ever passed through the environment - never interpolated into
      # a `run:` line, where it would be a command-injection vector.
      WORDCRAFT_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: rustfmt,clippy

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            macos-${{ runner.os }}-

      - name: Import the Developer ID certificate
        # Sets MACOS_SIGN_IDENTITY and MACOS_KEYCHAIN for the next steps. Without
        # APPLE_CERTIFICATE it warns and exits 0, and the build is ad-hoc signed.
        run: packaging/macos/import-cert.sh

      - name: Build, sign, notarize and package
        run: packaging/macos/package.sh --arch universal

      - name: Checksums
        run: |
          cd "${{ github.workspace }}/dist/release"
          # macOS has no sha256sum; shasum -a 256 is the portable form.
          shasum -a 256 ./*.dmg ./*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload the artifacts
        uses: actions/upload-artifact@v7
        with:
          name: iridium-docs-macos
          path: |
            ${{ github.workspace }}/dist/release/*.dmg
            ${{ github.workspace }}/dist/release/*.zip
            ${{ github.workspace }}/dist/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ github.workspace }}/dist/release/*.dmg
            ${{ github.workspace }}/dist/release/*.zip
            ${{ github.workspace }}/dist/release/SHA256SUMS.txt
          fail_on_unmatched_files: true

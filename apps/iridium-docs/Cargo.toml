[package]
name = "iridium-docs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
default-run = "iridium-docs"
description = "Docs desktop app"

[lints]
workspace = true

[dependencies]
iridium-docs-shell = { workspace = true }
# `UPDATE_APP` for the updater (process-wide, so it stays in main).
iridium-docs-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11", "links"] }
egui = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }

[build-dependencies]
# Icon + VERSIONINFO for iridium-docs.exe; build.rs only uses it when the target is Windows.
winresource = "0.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Closing the window must quit through NSApplication rather than by dropping the NSWindow
# inside the AppKit run loop (see `schedule_macos_terminate`).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication"] }
objc2 = "0.6"
dispatch2 = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
winit = { version = "0.30", default-features = false, features = ["x11"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# graphics.rs probes DirectX 12 adapters, waiting on wgpu's async API.
pollster = "1"

[target.'cfg(windows)'.dependencies]
craft-update = { workspace = true }

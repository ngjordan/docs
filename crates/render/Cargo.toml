[package]
name = "iridium-docs-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Docs rasteriser: pages and thumbnails from the layout display list (vello_cpu), PNG/JPEG export"

[lints]
workspace = true

[dependencies]
iridium-docs-geom = { workspace = true, features = ["image"] }
iridium-docs-doc = { workspace = true }
iridium-docs-fonts = { workspace = true }
iridium-docs-layout = { workspace = true }
iridium-docs-metafile = { workspace = true }
vello_cpu = { workspace = true }
image = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vello_cpu = { workspace = true, features = ["multithreading"] }
